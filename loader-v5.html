=>dates.add(t.date));\n","      state.tasks.filter(t=>t.done&&(t.completedAt||t.date)).forEach(t=>dates.add(t.completedAt||t.date));\n"],["    function toggleTopic(sid,tid){ const s=state.subjects.find(x=>x.id===sid); const t=s?.topics?.find(x=>x.id===tid); if(t){t.done=!t.done; if(t.done) award(XP.topic); else {save(); renderAll();}} }\n","    function toggleTopic(sid,tid){const s=state.subjects.find(x=>x.id===sid),t=s?.topics?.find(x=>x.id===tid);if(!t)return;const wasDone=!!t.done;t.done=!wasDone;if(t.done){if(t.xpAwarded!==true){adjustXP(XP.topic);t.xpAwarded=true;}}else{if(t.xpAwarded!==false){adjustXP(-XP.topic);t.xpAwarded=false;}}save();renderAll();}\n"],["    function completeReview(rid,iid){ const r=state.reviews.find(x=>x.id===rid); const it=r?.items?.find(x=>x.id===iid); if(it){ it.done=!it.done; it.completedAt=it.done?todayISO():null; if(it.done) state.xp=(state.xp||0)+(it.xp||20); save(); renderAll(); } }\n","    function completeReview(rid,iid){const r=state.reviews.find(x=>x.id===rid),it=r?.items?.find(x=>x.id===iid);if(!it)return;const today=todayISO();if(!it.done&&it.date>today)return toast(`Esta revisão está programada para ${fmtDate(it.date)}. Conclua-a na data prevista ou edite o grupo.`);if(it.done){it.done=false;it.completedAt=null;if(it.xpAwarded!==false){adjustXP(-(it.xp||20));it.xpAwarded=false;}}else{it.done=true;it.completedAt=today;if(it.xpAwarded!==true){adjustXP(it.xp||20);it.xpAwarded=true;}}save();renderAll();}\n    function rebalanceReviewBacklog(){const today=todayISO(),backlog=state.reviews.flatMap(group=>(group.items||[]).filter(item=>!item.done&&item.date<today).map(item=>({group,item})));if(!backlog.length)return toast('Não há revisões atrasadas para organizar.');if(!confirm(`Redistribuir ${backlog.length} revisão(ões) atrasada(s), com no máximo 5 pendências por dia?`))return;const rank={Alta:0,Média:1,Baixa:2},load={},groups={};state.reviews.forEach(group=>(group.items||[]).forEach(item=>{if(item.done||item.date<today)return;l
