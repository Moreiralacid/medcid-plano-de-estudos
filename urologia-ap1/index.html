<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEDCID Uro">
<link rel="manifest" href="./manifest.webmanifest">
<title>MEDCID Urologia — AP1 | UEA</title>
<style>
:root{--bg:#07111f;--p:#0d1b2a;--p2:#10263a;--line:#1e3a55;--t:#eef7ff;--m:#93a9bc;--c:#45c8ff;--g:#45d6a0;--a:#ffc36e;--r:#ff7481}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:radial-gradient(circle at 10% -10%,#123452 0,transparent 38%),var(--bg);color:var(--t);min-height:100vh}a{color:inherit}button,input,textarea{font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.head{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--c),#557cff);display:grid;place-items:center;color:#01111e;font-weight:900}.brand b{display:block}.brand span{font-size:11px;color:var(--m)}
main{max-width:1000px;margin:auto;padding:18px 14px calc(88px + env(safe-area-inset-bottom))}
.hero,.card{background:var(--p);border:1px solid var(--line);border-radius:18px}.hero{padding:20px;background:linear-gradient(135deg,rgba(69,200,255,.12),rgba(69,214,160,.05)),var(--p)}h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{color:var(--m);line-height:1.5}.badge{display:inline-flex;padding:6px 9px;border:1px solid rgba(69,200,255,.35);border-radius:999px;color:var(--c);font-size:11px;font-weight:800}
.progress{height:10px;background:var(--p2);border-radius:999px;overflow:hidden;margin:14px 0}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--g));width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:var(--p2);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--m)}
.section{margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:15px}.code{font-size:10px;color:var(--c);font-weight:900;letter-spacing:.08em}.title{font-weight:800;margin:4px 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--m)}.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:var(--p2);color:var(--t);border-radius:10px;padding:9px 11px;text-decoration:none;font-size:12px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--c),#4b89ff);border:0;color:#01111e;font-weight:900}.btn.good{color:var(--g);border-color:rgba(69,214,160,.35)}.btn.warn{color:var(--a);border-color:rgba(255,195,110,.35)}
.pareto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.pareto div{background:var(--p2);border-radius:10px;padding:9px;color:var(--m);font-size:12px}.note{width:100%;min-height:120px;background:var(--p2);border:1px solid var(--line);border-radius:10px;color:var(--t);padding:10px}.check{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.check:last-child{border-bottom:0}.callout{border:1px solid rgba(255,195,110,.3);background:rgba(255,195,110,.08);color:var(--a);padding:11px;border-radius:11px;font-size:12px}.search{width:100%;background:var(--p);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--t);margin-bottom:10px}.material{display:flex;justify-content:space-between;gap:10px;align-items:center}.material small{color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(13,27,42,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:transparent;border:0;color:var(--m);padding:10px 4px 8px;font-size:10px}nav button.active{color:var(--c)}nav b{display:block;font-size:18px;margin-bottom:2px}.page{display:none}.page.active{display:block}.timer{font-size:46px;text-align:center;font-weight:900;letter-spacing:.05em}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
@media(max-width:650px){.grid,.pareto{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:23px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">MC</div><div><b>MEDCID Urologia</b><span>AP1 · UEA / ESA · 6º período</span></div></div><span class="badge">5/5 módulos</span></div></header>
<main>
<section id="home" class="page active"><div id="homeContent"></div></section>
<section id="mods" class="page"><div id="modsContent"></div></section>
<section id="lib" class="page"><h2>Biblioteca</h2><input id="search" class="search" placeholder="Buscar material..." oninput="renderLib(this.value)"><div id="libContent"></div></section>
<section id="review" class="page"><div id="reviewContent"></div></section>
<section id="tools" class="page"><div id="toolsContent"></div></section>
</main>
<nav>
<button data-p="home" class="active" onclick="go('home')"><b>⌂</b>Início</button>
<button data-p="mods" onclick="go('mods')"><b>▦</b>Módulos</button>
<button data-p="lib" onclick="go('lib')"><b>▤</b>Materiais</button>
<button data-p="review" onclick="go('review')"><b>✓</b>Véspera</button>
<button data-p="tools" onclick="go('tools')"><b>◷</b>Estudo</button>
</nav>
<script>
var drive={
folder:"https://drive.google.com/drive/folders/12KkMOGqDYk49y8NIvek20c1xoVXydicw",
provas:"https://drive.google.com/file/d/1s2vCg9nCq-hPp_xsJzLN0JZqMAvK3KZL/view?usp=drivesdk",
aulas:"https://drive.google.com/drive/folders/10pveusqsXEOqWb-i5_HHJQ--eaI9fcU-",
academicos:"https://drive.google.com/file/d/1eqI2dm-Z5waXqaQit9tHbe_aMqB_rZXY/view?usp=drivesdk",
hpb:"https://drive.google.com/file/d/1BgGbRS370VkL-KnmKezc7cO2oIDyHneV/view?usp=drivesdk",
plano:"https://drive.google.com/file/d/1qtz_AKBFK1OzDC6FSEP-GiEhwJmxJOlg/view?usp=drivesdk",
medcurso:"https://drive.google.com/file/d/1ASDoPbXbJS_Oo40bQn0APK70_D4xJ7D8/view?usp=drivesdk",
geral:"https://drive.google.com/drive/folders/1g5_NcIBdm0sMX9cOG38d1iTFvQRikm6F?usp=share_link"
};
var modules=[
{id:"m1",n:"M1",t:"Anatomia e Embriologia Urogenital",pri:"Alta",link:drive.academicos,p:["Hilo: veia → artéria → pelve","3 estreitamentos ureterais","Metanefro = rim definitivo","Broto ureteral = coletor","Blastema metanéfrico = néfron","Wolff × Müller","HPB = transição; câncer = periferia"],trap:["Não inverter a ordem do hilo.","Broto ureteral não forma néfrons.","Wolff masculino; Müller feminino."]},
{id:"m2",n:"M2",t:"Infecção do Trato Urinário",pri:"Muito alta",link:drive.aulas,p:["E. coli","Cistite × pielonefrite","EAS + urocultura","Bacteriúria","ITU gestacional","Quando pedir imagem","Obstrução infectada = ATB + descompressão"],trap:["Obstrução infectada não se trata só com antibiótico.","Cistite e pielonefrite não têm a mesma apresentação."]},
{id:"m3",n:"M3",t:"Hiperplasia Prostática Benigna",pri:"Muito alta",link:drive.hpb,p:["Zona de transição","DHT / 5α-redutase","LUTS: armazenamento × esvaziamento","IPSS","PSA sob 5-ARI","Alfa-bloqueadores","5-ARI","Retenção urinária","RTU / HoLEP"],trap:["Tamanho prostático não equivale à intensidade dos sintomas.","5-ARI reduz PSA."]},
{id:"m4",n:"M4",t:"Câncer de Próstata",pri:"Muito alta",link:drive.academicos,p:["Zona periférica","PSA + toque","RM / PI-RADS","Biópsia","Gleason / ISUP","TNM","Vigilância ativa","Prostatectomia","DE + incontinência","ADT"],trap:["HPB = transição; câncer = periferia.","Separar resposta histórica da banca de conduta atual."]},
{id:"m5",n:"M5",t:"Litíase Urinária / Cólica Renal",pri:"Muito alta",link:drive.medcurso,p:["Composição / radiopacidade","TC sem contraste","Cólica renal","Estruvita / coraliforme","AINE","Terapia expulsiva","LECO × URS/RIRS × PCNL","Sepse + obstrução = drenagem urgente","Prevenção"],trap:["Hidronefrose não significa infecção.","Sepse + obstrução exige descompressão."]}
];
var materials=[
["Pasta Urologia — UEA","UEA",drive.folder],["Provas Uro COMPILADÃO até Med42","Provas",drive.provas],["Aulas — Urologia","UEA",drive.aulas],["Urologia-Acadêmicos.pdf","Complementar",drive.academicos],["HPB 2023 SBU SP.pdf","Módulo",drive.hpb],["Plano de Ensino UEA 2023.2","UEA",drive.plano],["MEDCURSO CIR 2 — Urologia","Complementar",drive.medcurso],["Drive geral do 6º período","UEA",drive.geral]
];
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function arr(k){return get(k,[])}
function toggle(k,id){var a=arr(k),i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);set(k,a);renderAll()}
function go(id){document.querySelectorAll(".page").forEach(function(x){x.classList.toggle("active",x.id===id)});document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("active",x.dataset.p===id)});window.scrollTo(0,0)}
function card(m){var done=arr("uro.done").indexOf(m.id)>=0;return '<div class="card"><div class="code">'+m.n+'</div><div class="title">'+m.t+'</div><div class="chips"><span class="chip">Prioridade '+m.pri+'</span><span class="chip">'+(done?"Concluído":"Pronto")+'</span></div><p>'+m.p.slice(0,3).join(" · ")+'</p><div class="btns"><button class="btn primary" onclick="openModule(\''+m.id+'\')">Estudar</button><a class="btn" target="_blank" rel="noopener" href="'+m.link+'">Material</a><button class="btn '+(done?"good":"")+'" onclick="toggle(\'uro.done\',\''+m.id+'\')">'+(done?"✓ Estudado":"Marcar")+'</button></div></div>'}
function renderHome(){var d=arr("uro.done").length,r=arr("uro.review").length,p=Math.round(d/5*100);document.getElementById("homeContent").innerHTML='<div class="hero"><span class="badge">AP1 COMPLETA EM CONTEÚDO</span><h1>Urologia AP1, organizada para revisão ativa.</h1><p>5 módulos, links da UEA, provas antigas, videoaulas verificadas e progresso salvo no iPhone.</p><div class="progress"><i style="width:'+p+'%"></i></div><div class="stats"><div class="stat"><b>'+d+'</b><span>estudados</span></div><div class="stat"><b>'+r+'</b><span>revisar</span></div><div class="stat"><b>'+p+'%</b><span>progresso</span></div></div><div class="btns"><button class="btn primary" onclick="go(\'mods\')">Começar</button><a class="btn" target="_blank" rel="noopener" href="'+drive.provas+'">Provas antigas</a></div></div><div class="section"><h2>Módulos</h2><div class="grid">'+modules.map(card).join("")+'</div></div><div class="section callout">No iPhone: abra este site no Safari → Compartilhar → Adicionar à Tela de Início. Assim ele funciona como um app.</div>'}
function renderMods(){document.getElementById("modsContent").innerHTML='<h2>5 módulos da AP1</h2><div class="grid">'+modules.map(card).join("")+'</div><div id="moduleDetail" class="section"></div>'}
function openModule(id){go("mods");var m=modules.filter(function(x){return x.id===id})[0];var note=get("uro.note."+id,"");document.getElementById("moduleDetail").innerHTML='<div class="card"><div class="code">'+m.n+'</div><h2>'+m.t+'</h2><div class="pareto">'+m.p.map(function(x){return "<div>• "+x+"</div>"}).join("")+'</div><div class="section"><h3>Pegadinhas</h3>'+m.trap.map(function(x){return "<div class=\'callout\' style=\'margin:7px 0\'>"+x+"</div>"}).join("")+'</div><div class="btns"><a class="btn primary" target="_blank" rel="noopener" href="'+m.link+'">Abrir material</a><button class="btn warn" onclick="toggle(\'uro.review\',\''+m.id+'\')">Revisar depois</button></div><div class="section"><h3>Notas</h3><textarea id="note-'+id+'" class="note" placeholder="Erros, dúvidas e frases de memorização...">'+note+'</textarea><div class="btns"><button class="btn primary" onclick="set(\'uro.note.'+id+'\',document.getElementById(\'note-'+id+'\').value)">Salvar nota</button></div></div><div class="section"><h3>Active recall</h3>'+m.p.slice(0,6).map(function(x,i){var k="uro.ck."+id+"."+i;return '<label class="check"><input type="checkbox" '+(get(k,false)?"checked":"")+' onchange="set(\''+k+'\',this.checked)"><span>Consigo explicar sem olhar: '+x+'</span></label>'}).join("")+'</div></div>';document.getElementById("moduleDetail").scrollIntoView({behavior:"smooth"})}
function renderLib(q){q=(q||"").toLowerCase();var f=materials.filter(function(x){return (x[0]+" "+x[1]).toLowerCase().indexOf(q)>=0});document.getElementById("libContent").innerHTML=f.map(function(x){return '<div class="card material" style="margin:8px 0"><div><div class="code">'+x[1]+'</div><b>'+x[0]+'</b></div><a class="btn primary" target="_blank" rel="noopener" href="'+x[2]+'">Abrir</a></div>'}).join("")+'<div class="section"><h2>Videoaulas — Estratégia MED</h2><div class="grid"><div class="card"><iframe class="video" src="https://www.youtube.com/embed/ironpLn_qwg" allowfullscreen></iframe><p>Urologia — Aula de Cirurgia do Curso Intensivo</p></div><div class="card"><iframe class="video" src="https://www.youtube.com/embed/FA63CMn-odE" allowfullscreen></iframe><p>Questões Comentadas de Urologia</p></div><div class="card"><iframe class="video" src="https://www.youtube.com/embed/Vtyyb8hY7b4" allowfullscreen></iframe><p>Infecção do Trato Urinário — Super Revisão</p></div></div></div>'}
var eve=[["M1",["Hilo: veia → artéria → pelve","3 estreitamentos ureterais","Metanefro definitivo","Wolff × Müller"]],["M2",["E. coli","Cistite × pielonefrite","Urocultura conforme contexto","Obstrução infectada = ATB + drenagem"]],["M3",["HPB = transição","DHT","LUTS / IPSS","Alfa-bloqueador × 5-ARI"]],["M4",["Câncer = periferia","PSA / toque","Gleason / ISUP","Prostatectomia: DE + incontinência"]],["M5",["TC sem contraste","Radiopacidade","Estruvita / coraliforme","Sepse + obstrução = drenagem"]]];
function renderReview(){document.getElementById("reviewContent").innerHTML='<h2>Revisão de véspera</h2><div class="grid">'+eve.map(function(x){return '<div class="card"><div class="code">'+x[0]+'</div>'+x[1].map(function(y){return '<label class="check"><input type="checkbox"><span>'+y+'</span></label>'}).join("")+'</div>'}).join("")+'</div><div class="section"><a class="btn primary" target="_blank" rel="noopener" href="'+drive.provas+'">Abrir provas antigas</a></div>'}
var sec=1500,t=null;function fmt(){return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}function tick(){var e=document.getElementById("timer");if(e)e.textContent=fmt()}function start(){if(t)return;t=setInterval(function(){sec--;tick();if(sec<=0){clearInterval(t);t=null;alert("Bloco concluído. Pausa de 5 minutos.");sec=300;tick()}},1000)}function reset(){clearInterval(t);t=null;sec=1500;tick()}
function renderTools(){document.getElementById("toolsContent").innerHTML='<div class="grid"><div class="card"><h2>Pomodoro 25/5</h2><div id="timer" class="timer">'+fmt()+'</div><div class="btns" style="justify-content:center"><button class="btn primary" onclick="start()">Iniciar</button><button class="btn" onclick="reset()">Resetar</button></div></div><div class="card"><h2>Caderno de erros</h2><textarea id="errors" class="note" placeholder="Ex.: M5 — confundi ácido úrico com estruvita...">'+get("uro.errors","")+'</textarea><div class="btns"><button class="btn primary" onclick="set(\'uro.errors\',document.getElementById(\'errors\').value)">Salvar</button></div></div></div><div class="section card"><h3>Reset</h3><p>Apaga somente progresso, notas e checklists deste site no aparelho.</p><button class="btn warn" onclick="if(confirm(\'Resetar todo o progresso?\')){Object.keys(localStorage).filter(function(k){return k.indexOf(\'uro.\')===0}).forEach(function(k){localStorage.removeItem(k)});renderAll()}">Resetar progresso</button></div>'}
function renderAll(){renderHome();renderMods();renderLib("");renderReview();renderTools()}renderAll();if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
</script>
</body>
</html>
